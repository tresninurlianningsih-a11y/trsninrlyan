<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - SMK Negeri 6 Kendari</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--color-navy-dark) 0%, var(--color-navy) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .login-container {
      background: rgba(23, 42, 69, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(197, 160, 89, 0.25);
      border-radius: 12px;
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      transition: var(--transition-smooth);
      text-align: center;
    }

    .login-logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px auto;
      background: var(--color-white);
      border-radius: 50%;
      padding: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-title {
      font-family: var(--font-classic);
      color: var(--color-gold-light);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .login-subtitle {
      color: var(--color-gray);
      font-size: 0.85rem;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
      text-align: left;
    }

    .form-label {
      display: block;
      color: var(--color-gold);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-gold);
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      background: rgba(10, 25, 47, 0.6);
      border: 1px solid rgba(197, 160, 89, 0.2);
      border-radius: 6px;
      color: var(--color-white);
      font-size: 0.95rem;
      font-family: var(--font-sans);
      transition: var(--transition-fast);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--color-gold);
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.2);
      background: rgba(10, 25, 47, 0.8);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-dark) 100%);
      border: none;
      border-radius: 6px;
      color: var(--color-navy-dark);
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.2);
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(197, 160, 89, 0.35);
      background: linear-gradient(135deg, var(--color-gold-dark) 0%, var(--color-gold) 100%);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-alert {
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid rgba(220, 53, 69, 0.4);
      color: #ff8585;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
      text-align: left;
    }

    .error-alert i {
      margin-right: 8px;
    }

    .back-to-home {
      display: inline-block;
      margin-top: 25px;
      color: var(--color-gray);
      font-size: 0.85rem;
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .back-to-home:hover {
      color: var(--color-gold);
    }

    .back-to-home i {
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">
      <img src="logo smk6.png" alt="SMKN 6 Kendari Logo">
    </div>
    <h1 class="login-title">SMKN 6 KENDARI</h1>
    <p class="login-subtitle">Portal Administrasi Website</p>

    <!-- Error Alert Container -->
    <div id="errorAlert" class="error-alert">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="errorMessage">Username atau password salah.</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input class="form-input" type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input class="form-input" type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span>MASUK KE DASHBOARD</span>
      </button>
    </form>

    <a href="index.html" class="back-to-home">
      <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
    </a>
  </div>

  <script>
    // Handle form submit
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Show loading status
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...';
      errorAlert.style.display = 'none';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Success, redirect to dashboard
          window.location.href = '/admin.html';
        } else {
          // Show error message
          errorMessage.textContent = data.error || 'Username atau password salah';
          errorAlert.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      } catch (err) {
        console.error(err);
        errorMessage.textContent = 'Gagal terhubung ke server. Pastikan server aktif.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
      }
    });
  </script>
</body>
</html>
